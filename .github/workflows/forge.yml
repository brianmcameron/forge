name: Forge

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        type: choice
        options: [build-apk, refresh-trends]
        default: build-apk
      food_db:
        description: 'Offline food database size (full = about 1.9 million foods)'
        type: choice
        options: [full, lite]
        default: full
      fdc_url:
        description: 'Optional: direct link to the FoodData Central CSV zip (only if the automatic lookup fails)'
        required: false
        default: ''
      google_web_client_id:
        description: 'Optional: your Google OAuth Web Client ID (enables Google sign-in and Drive backup). Leave blank to skip.'
        required: false
        default: ''
  schedule:
    - cron: '17 9 * * *'   # refreshes the trending workouts every day

permissions:
  contents: write

jobs:
  trends:
    if: github.event_name == 'schedule' || inputs.task == 'refresh-trends'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unpack project
        run: unzip -q -o forge-project.zip -d project
      - name: Build trends.json
        run: python3 project/scripts/build_trends.py docs/trends.json
      - name: Save it to the repo
        run: |
          git config user.name "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          git add docs/trends.json
          git diff --cached --quiet || (git commit -m "Update trending workouts" && git push)

  apk:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Unpack project
        run: unzip -q -o forge-project.zip -d project

      - name: Create a fresh Expo app
        run: |
          npx --yes create-expo-app@latest forge-app --template blank --no-install
